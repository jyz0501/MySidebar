[versions]
agp = "8.5.2"
kotlin = "1.9.24"
composeBom = "2024.06.00"
composeCompiler = "1.5.14"
coreKtx = "1.13.1"
activityCompose = "1.9.0"
lifecycle = "2.8.3"
savedstate = "1.2.1"
