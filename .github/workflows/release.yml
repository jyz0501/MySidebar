name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as a draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore (optional, for real signed release)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KPP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            {
              echo "STORE_FILE=keystore/release.jks"
              echo "STORE_PASSWORD=$KP"
              echo "KEY_ALIAS=$KA"
              echo "KEY_PASSWORD=$KPP"
            } > keystore.properties
          fi

      - name: Read version & signing label
        id: meta
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          major=$(grep '^major=' version.properties | cut -d= -f2)
          minor=$(grep '^minor=' version.properties | cut -d= -f2)
          patch=$(grep '^patch=' version.properties | cut -d= -f2)
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "sign=v2v3已签名" >> "$GITHUB_OUTPUT"
          else
            echo "sign=v2v3调试签名" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for release asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "轻边栏_v${{ steps.meta.outputs.version }}_${{ steps.meta.outputs.sign }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 轻边栏 v${{ steps.meta.outputs.version }}
          files: "轻边栏_v${{ steps.meta.outputs.version }}_${{ steps.meta.outputs.sign }}.apk"
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
